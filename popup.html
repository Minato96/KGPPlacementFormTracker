<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>KGP Fill The Form</title>

  <style>
    body {
      font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 680px;
      margin: 0;
      color: #222;
      background: #fff;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #ddd;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .subtitle {
      color: #777;
      margin-top: 2px;
    }

    .plan {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }

    .free {
      background: #eee;
      color: #555;
    }

    .pro {
      background: #fff0c2;
      color: #8a6200;
    }

    .upgrade {
      margin: 10px 16px;
      padding: 10px 12px;
      border: 1px solid #e5c76b;
      border-radius: 7px;
      background: #fffaf0;
    }

    .upgrade-title {
      font-weight: 700;
    }

    .upgrade-text {
      margin-top: 3px;
      color: #666;
    }

    button {
      margin-top: 8px;
      padding: 6px 10px;
      border: 1px solid #bbb;
      border-radius: 5px;
      background: white;
      cursor: pointer;
    }

    button:hover {
      background: #f5f5f5;
    }

    #info {
      padding: 4px 16px 8px;
      color: #777;
    }

    #out {
      padding: 0 16px 16px;
    }

    h3 {
      margin: 14px 0 6px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td,
    th {
      padding: 7px 6px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: middle;
    }

    th {
      font-size: 11px;
      color: #777;
      font-weight: 600;
    }

    .crit {
      font-weight: 700;
    }

    .warn {
      font-weight: 700;
    }

    .ok {
      font-weight: 700;
    }

    .done {
      color: #999;
    }

    tr.d td {
      opacity: 0.5;
    }

    a {
      color: #06c;
      margin-right: 6px;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    small {
      color: #777;
    }

    .locked {
      color: #8a6200;
      font-weight: 700;
      white-space: nowrap;
    }

    .dev {
      margin: 0 16px 16px;
      padding: 8px;
      border: 1px dashed #aaa;
      background: #fafafa;
      font-size: 11px;
    }

    .dev button {
      font-size: 11px;
      margin-right: 5px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="title">KGP Fill The Form</div>
    <div class="subtitle">IIT KGP Placement & Internship Tracker</div>
    <span id="plan" class="plan free">FREE</span>
  </div>

  <div id="upgrade"></div>

  <div id="info"></div>

  <div id="out"></div>

  <!-- Temporary development controls.
       Remove these before production/payment integration. -->
  <div class="dev">
    <b>Development controls</b><br>
    <button id="enablePro">Enable PRO</button>
    <button id="disablePro">Disable PRO</button>
  </div>

  <script src="parse.js"></script>
  <script src="popup.js"></script>

</body>
</html>
